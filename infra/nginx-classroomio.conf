# Nginx reverse proxy para ClassroomIO — deploy nativo en VPS.
#
# TLS lo termina Cloudflare (modo Flexible o Full). El origin escucha en :80;
# Cloudflare proxea los subdominios learn / learn-api hacia la IP del VPS.
# Para Cloudflare Full (strict) habría que agregar un Origin Certificate acá
# (listen 443 ssl + ssl_certificate). Ver infra/README.md.
#
# Instalar en el VPS (lo hace setup-vps.sh):
#   sudo cp infra/nginx-classroomio.conf /etc/nginx/sites-available/classroomio
#   sudo ln -s /etc/nginx/sites-available/classroomio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NO toca la config de saas-rrhh: son server blocks separados por server_name.

# ── Dashboard (SSR SvelteKit) ────────────────────────────────────────────────
server {
    listen 80;
    server_name learn.tensor.com.ar;

    access_log /var/log/nginx/classroomio-dashboard-access.log;
    error_log  /var/log/nginx/classroomio-dashboard-error.log;

    add_header X-Content-Type-Options "nosniff";

    # Subida de videos/documentos: límite generoso (la API los recibe vía proxy).
    client_max_body_size 200M;

    location / {
        proxy_pass         http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
    }
}

# ── API (Hono / @hono/node-server) ───────────────────────────────────────────
server {
    listen 80;
    server_name learn-api.tensor.com.ar;

    access_log /var/log/nginx/classroomio-api-access.log;
    error_log  /var/log/nginx/classroomio-api-error.log;

    add_header X-Content-Type-Options "nosniff";

    # Uploads de media van por la API → necesita body grande + timeouts largos.
    client_max_body_size 200M;

    location / {
        proxy_pass         http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;
    }
}

# ── Subdominios de empresa (tenant sites) ────────────────────────────────────
# Cualquier <empresa>.tensor.com.ar (globex, egea, one, ...) va al MISMO dashboard.
# El dashboard resuelve qué empresa es leyendo el Host header (getOrgSiteInfo →
# getSubdomain → busca la org por siteName). Requiere en Cloudflare un A record
# wildcard `*.tensor.com.ar → IP` (proxied) y PRIVATE_APP_HOST=tensor.com.ar en el
# .env del dashboard.
#
# Los server blocks exactos de arriba (learn / learn-api) tienen prioridad sobre
# este regex, así que learn.tensor.com.ar NO cae acá. Nginx evalúa: exacto →
# regex, en ese orden.
server {
    listen 80;
    server_name ~^(?<orgsub>[^.]+)\.tensor\.com\.ar$;

    access_log /var/log/nginx/classroomio-tenant-access.log;
    error_log  /var/log/nginx/classroomio-tenant-error.log;

    add_header X-Content-Type-Options "nosniff";
    client_max_body_size 200M;

    location / {
        proxy_pass         http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;   # crítico: el tenant se resuelve por Host
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
    }
}

# ── Media pública de MinIO (opcional) ────────────────────────────────────────
# El bucket `media` es de descarga anónima. Para servirlo por dominio en vez de
# IP:9000, descomentar y apuntar OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL acá.
