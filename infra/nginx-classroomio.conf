# Nginx reverse proxy para ClassroomIO — deploy nativo en VPS.
#
# TLS: la zona tensor.com.ar en Cloudflare está en modo Full (strict), así que el
# origin DEBE responder por HTTPS:443 con un cert válido. Reusamos el Cloudflare
# Origin Certificate ya instalado para tensor.com.ar (cubre *.tensor.com.ar +
# tensor.com.ar), el mismo que usa saas-rrhh. El :80 solo redirige a :443.
#
# Instalar en el VPS (lo hace setup-vps.sh):
#   sudo cp infra/nginx-classroomio.conf /etc/nginx/sites-available/classroomio
#   sudo ln -s /etc/nginx/sites-available/classroomio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# NO toca la config de saas-rrhh: son server blocks separados por server_name.

# Cloudflare Origin Certificate para *.tensor.com.ar (ya instalado, lo usa rrhh).
# Se referencia en cada server block de :443.
#   ssl_certificate     /etc/ssl/cloudflare-tensor.pem;
#   ssl_certificate_key /etc/ssl/cloudflare-tensor.key;

# ── Caché del documento HTML ─────────────────────────────────────────────────
#
# El problema que resuelve: SvelteKit sirve sus bundles bajo /_app/immutable/ con
# el hash en el nombre y `max-age=31536000, immutable`, que está bien — ese
# archivo nunca cambia. Pero el DOCUMENTO HTML, que es el que dice QUÉ bundle
# cargar, salía sin ningún Cache-Control. Sin instrucción, el navegador (y
# Cloudflare) aplican su propia heurística: después de un deploy la gente seguía
# con el HTML viejo, que apunta a los chunks viejos, hasta hacer recarga forzada.
# Con alumnos usando la plataforma eso no es una molestia, es una versión vieja
# corriendo en producción sin que nadie se entere.
#
# `no-cache` NO significa "no guardes": significa "guardalo, pero revalidá antes
# de usarlo". Medido acá: el documento sale SIN ETag ni Last-Modified, así que la
# revalidación no puede terminar en 304 y se vuelve a bajar entero. No importa —
# es una página renderizada en el servidor, distinta en cada visita y por usuario;
# nunca debió cachearse. Lo que pesa es el bundle, y ese sigue con su año.
#
# Se aplica SOLO al HTML, por content-type: los assets con hash conservan su año
# de caché. `add_header` con valor vacío no agrega nada, así que el resto de las
# respuestas queda intacto.
map $upstream_http_content_type $cio_doc_cache {
    default      "";
    ~*text/html  "no-cache";
}

# ── Dashboard (SSR SvelteKit) ────────────────────────────────────────────────
server {
    listen 80;
    server_name learn.tensor.com.ar;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name learn.tensor.com.ar;

    ssl_certificate     /etc/ssl/cloudflare-tensor.pem;
    ssl_certificate_key /etc/ssl/cloudflare-tensor.key;

    access_log /var/log/nginx/classroomio-dashboard-access.log;
    error_log  /var/log/nginx/classroomio-dashboard-error.log;

    add_header X-Content-Type-Options "nosniff";
    # Ver el bloque `map` arriba. A nivel server y no dentro del location: un
    # add_header en un nivel anula los heredados, y el location perdería el
    # nosniff de arriba.
    add_header Cache-Control $cio_doc_cache always;

    # Subida de videos/documentos: límite generoso (la API los recibe vía proxy).
    client_max_body_size 200M;

    location / {
        proxy_pass         http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;

        # El dashboard (SvelteKit + better-auth) emite headers/cookies de sesión
        # grandes; sin esto Nginx rechaza con "upstream sent too big header" (502
        # → 520 en Cloudflare). El bloque de headers de respuesta post-login (varias
        # Set-Cookie + headers de SvelteKit) supera 16k, así que el buffer INICIAL
        # (proxy_buffer_size, donde entran los headers) debe ser holgado: 64k.
        proxy_buffer_size         64k;
        proxy_buffers           8 64k;
        proxy_busy_buffers_size  128k;
    }
}

# ── API (Hono / @hono/node-server) ───────────────────────────────────────────
server {
    listen 80;
    server_name learn-api.tensor.com.ar;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name learn-api.tensor.com.ar;

    ssl_certificate     /etc/ssl/cloudflare-tensor.pem;
    ssl_certificate_key /etc/ssl/cloudflare-tensor.key;

    access_log /var/log/nginx/classroomio-api-access.log;
    error_log  /var/log/nginx/classroomio-api-error.log;

    add_header X-Content-Type-Options "nosniff";

    # Uploads de media van por la API → necesita body grande + timeouts largos.
    client_max_body_size 200M;

    location / {
        proxy_pass         http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;

        proxy_buffer_size         64k;
        proxy_buffers           8 64k;
        proxy_busy_buffers_size  128k;
    }
}

# ── Subdominios de empresa (tenant sites) ────────────────────────────────────
# Cualquier <empresa>.tensor.com.ar (globex, acme, one, ...) va al MISMO dashboard.
# El dashboard resuelve qué empresa es leyendo el Host header (getOrgSiteInfo →
# getSubdomain → busca la org por siteName). Requiere en Cloudflare un A record
# wildcard `*.tensor.com.ar → IP` (proxied) y PRIVATE_APP_HOST=tensor.com.ar en el
# .env del dashboard. El cert *.tensor.com.ar cubre estos subdominios.
#
# Los server blocks exactos de arriba (learn / learn-api) tienen prioridad sobre
# este regex, así que learn.tensor.com.ar NO cae acá. Nginx evalúa: exacto →
# regex, en ese orden.
server {
    listen 80;
    server_name ~^(?<orgsub>[^.]+)\.tensor\.com\.ar$;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name ~^(?<orgsub>[^.]+)\.tensor\.com\.ar$;

    ssl_certificate     /etc/ssl/cloudflare-tensor.pem;
    ssl_certificate_key /etc/ssl/cloudflare-tensor.key;

    access_log /var/log/nginx/classroomio-tenant-access.log;
    error_log  /var/log/nginx/classroomio-tenant-error.log;

    add_header X-Content-Type-Options "nosniff";
    # Ver el bloque `map` arriba. A nivel server y no dentro del location: un
    # add_header en un nivel anula los heredados, y el location perdería el
    # nosniff de arriba.
    add_header Cache-Control $cio_doc_cache always;
    client_max_body_size 200M;

    location / {
        proxy_pass         http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;   # crítico: el tenant se resuelve por Host
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;

        proxy_buffer_size         64k;
        proxy_buffers           8 64k;
        proxy_busy_buffers_size  128k;
    }
}

# ── Storage / MinIO (learn-files.tensor.com.ar) ──────────────────────────────
# Expone la API S3 de MinIO (:9000) por HTTPS para que el navegador pueda subir y
# ver archivos. Solo el bucket `media` es de lectura anónima (imágenes públicas:
# logos, portadas, avatares); `videos` y `documents` son privados y se sirven con
# URLs firmadas — exponer el endpoint NO los hace públicos. Requiere el A record
# `learn-files.tensor.com.ar → IP` (proxied) en Cloudflare.
server {
    listen 80;
    server_name learn-files.tensor.com.ar;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name learn-files.tensor.com.ar;

    ssl_certificate     /etc/ssl/cloudflare-tensor.pem;
    ssl_certificate_key /etc/ssl/cloudflare-tensor.key;

    access_log /var/log/nginx/classroomio-files-access.log;
    error_log  /var/log/nginx/classroomio-files-error.log;

    # Subida de videos/documentos grandes por PUT presigned.
    client_max_body_size 500M;

    location / {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Subidas/descargas largas de media.
        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;   # stream de uploads grandes sin bufferear a disco
    }
}

# ── Clientes con dominio propio ──────────────────────────────────────
#
# NO van en este archivo. Cada empresa que usa SU propio dominio tiene un
# `.conf` aparte en `infra/clientes/`, que está **gitignoreada**: este
# repositorio es público, y un `server_name` con el dominio real de un cliente
# publica quién es cliente de quién.
#
# Plantilla: `infra/clientes/cliente.conf.ejemplo`. Copiarla, completar dominio,
# certificados y logs, y dejarla en el VPS. `setup-vps.sh` copia todo lo que
# encuentre ahí.
#
# Ojo: el rsync del deploy corre con `--delete` y los borraría, igual que se
# comió los `.env` una vez. Por eso `infra/clientes/` está en los `--exclude`
# del workflow. Si agregás otra carpeta que sólo vive en el servidor, acordate
# de excluirla también.
