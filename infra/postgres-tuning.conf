# PostgreSQL tuning conservador (VPS compartido con saas-rrhh).
#
# MEDIDO 2026-08-27: el VPS es un KVM2 — 8GB / 2 nucleos / 100GB, con ~6GB
# disponibles en reposo. Este archivo decia "KVM1, 4GB" y esa cifra vieja es la
# que se usaba para decidir si algo entraba o no: por eso se corrige aca y no
# solo en el README.
#
# Los valores se dejan como estan igual: son holgados para la carga real y
# liberan RAM para Node, ffmpeg y el Chromium que imprime los certificados.
#
# Se instala como drop-in en conf.d para NO pisar el postgresql.conf por defecto:
#   sudo cp infra/postgres-tuning.conf /etc/postgresql/16/main/conf.d/classroomio-tuning.conf
#   sudo systemctl restart postgresql
#
# Valores pensados para que Postgres no se coma la RAM que necesitan los procesos
# Node + ffmpeg. ClassroomIO es de carga moderada (pocos usuarios en la prueba),
# así que conexiones y buffers van acotados.

# Caché de páginas en memoria compartida. ~128MB es suficiente para la prueba y
# deja RAM para el resto del stack.
shared_buffers = 128MB

# Estimación de cuánta caché (incluida la del SO) hay disponible para Postgres.
# No reserva memoria; solo guía al planificador. 512MB es conservador para 4GB.
effective_cache_size = 512MB

# Memoria por operación de sort/hash. Bajo a propósito: con max_connections=50,
# work_mem alto se multiplicaría y reventaría la RAM bajo concurrencia.
work_mem = 8MB

# Mantenimiento (VACUUM, CREATE INDEX —incl. el HNSW de pgvector). Puntual.
maintenance_work_mem = 64MB

# Techo de conexiones. La app no necesita muchas; menos conexiones = menos RAM.
max_connections = 50

# Coincide con effective_io_concurrency razonable para discos SSD de VPS.
effective_io_concurrency = 200

# WAL acotado para no inflar disco (45GB libres).
max_wal_size = 1GB
min_wal_size = 128MB
