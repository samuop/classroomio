name: Deploy ClassroomIO to VPS

# Buildea en el runner de GitHub (7GB RAM — el build del dashboard pide ~3GB de
# heap que NO entran en el VPS de 4GB) y despliega artefactos al VPS vía rsync.
# El VPS solo reinstala node_modules de runtime y corre los procesos con PM2.

on:
  # Deploy automático al pushear a main (el primer deploy end-to-end ya funcionó).
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-classroomio.yml'
  # Re-disparar a mano desde la pestaña Actions sin commit.
  workflow_dispatch:

concurrency:
  group: deploy-classroomio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. pnpm + Node 20 ────────────────────────────────────────────────
      - name: Setup pnpm
        # Sin `version:` — se toma de `packageManager` en package.json. Especificar
        # ambos hace fallar action-setup con "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.3'
          cache: 'pnpm'

      # ── 3. Install (full, con devDeps — necesario para buildear) ─────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 4. Build api + dashboard + jobs-worker ───────────────────────────
      # Heap grande para el dashboard (vite). PUBLIC_IS_SELFHOSTED en build-time
      # porque el adapter lo lee al generar el bundle.
      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
          # PUBLIC_IS_SELFHOSTED va en 'false' a propósito, y es lo que ENCIENDE
          # el multiempresa. En 'true', getOrgSiteInfo() devuelve la primera
          # organización y NUNCA mira el host: subdominios y dominios propios
          # quedan muertos. Apagarlo también hace que el navegador hable con la
          # API por /proxy del MISMO origen (ver getRequestBaseUrl), que es lo
          # que permite cookies de origen propio en el dominio de cada cliente.
          # Efectos colaterales revisados: la licencia deja de restringir (no al
          # revés), la analítica de terceros no tiene claves configuradas, y los
          # planes ya no se cortocircuitan — por eso toda organización necesita
          # una fila activa en organization_plan (db:plans-backfill).
          PUBLIC_IS_SELFHOSTED: 'false'
          # Horneado en el bundle del dashboard en build-time (envPrefix incluye
          # PUBLIC_): así los subdominios de empresa salen como <site>.tensor.com.ar
          # y no con el fallback myclassroomio.com. Ponerlo solo en el .env del VPS
          # NO alcanza — el browser recibe el literal ya compilado.
          PUBLIC_TENANT_ROOT_DOMAIN: 'tensor.com.ar'
          # Dominio del object-storage (MinIO tras Nginx). SvelteKit hornea la CSP en
          # build-time; sin esto, img-src/media-src no incluyen el storage y el browser
          # bloquea las imágenes subidas (avatar/logo salen rotos). Ver svelte.config.js.
          PUBLIC_MEDIA_HOST: 'learn-files.tensor.com.ar'
        run: |
          # jobs-worker reincluido: se implementó ffmpegProbeLuma (utils/ffmpeg.ts),
          # el bug del fork que lo hacía no compilar. El worker procesa la cola de
          # emails (invitaciones a alumnos) + media (thumbnails/transcode de video).
          pnpm -r \
            --filter @cio/api... \
            --filter @cio/dashboard... \
            --filter @cio/jobs-worker... \
            build

      - name: Verify build output
        run: |
          test -f apps/api/dist/index.js        || (echo "ERROR: falta apps/api/dist/index.js" && exit 1)
          test -f apps/dashboard/build/index.js || (echo "ERROR: falta apps/dashboard/build/index.js" && exit 1)
          test -f apps/jobs/dist/index.js       || (echo "ERROR: falta apps/jobs/dist/index.js" && exit 1)

      # ── 5. Tests ─────────────────────────────────────────────────────────
      # Antes de esto el deploy no corría UN SOLO test: compilaba y publicaba.
      # Los `.int.test.ts` quedan afuera solos (piden un Postgres levantado, ver
      # apps/api/vitest.config.ts), así que esto no necesita servicios.
      #
      # DESPUÉS del build, y no antes, aunque el build tarde varios minutos:
      # **la suite de la API necesita los paquetes construidos**. `@cio/db` está
      # apuntado a `dist/` a propósito en vitest.shared.ts (Vite no sigue el
      # patrón de subrutas `./queries/*` de su exports map), y `@cio/utils`
      # resuelve por su package.json, que también apunta a `dist/`.
      #
      # En una máquina de desarrollo esto no se ve: `dist/` ya está ahí de un
      # build anterior. En un runner limpio no existe, y 45 de 59 suites fallan
      # con ERR_MODULE_NOT_FOUND sin que haya nada roto de verdad. Pasó en el
      # run 32965334422.
      - name: Test
        run: pnpm --filter @cio/api --filter @cio/dashboard test

      # ── 6. SSH setup (patrón robusto: keyscan con backoff por fail2ban) ──
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          HOST="${{ secrets.VPS_HOST }}"
          # keyscan poblar known_hosts es best-effort: la conectividad
          # runner→VPS es a veces intermitente. Reintentamos con timeout
          # generoso, pero NO abortamos si falla — más abajo se usa
          # StrictHostKeyChecking=accept-new como red de seguridad, así una
          # falla puntual de keyscan no tumba el deploy entero.
          ok=0
          for intento in 1 2 3 4 5 6 7 8; do
            echo "==> keyscan intento $intento contra $HOST"
            if ssh-keyscan -T 30 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              ok=1; break
            fi
            espera=$((intento * 10))
            echo "    sin respuesta — reintento en ${espera}s"
            sleep $espera
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::keyscan no respondió tras 8 intentos; se continúa con accept-new (host key se acepta en la primera conexión)."
          fi

          cat > ~/.ssh/config <<SSHCFG
          Host *
            ConnectTimeout 30
            ConnectionAttempts 5
            ServerAliveInterval 15
            ServerAliveCountMax 8
            StrictHostKeyChecking accept-new
          SSHCFG
          chmod 600 ~/.ssh/config

      # ── 7. rsync del repo buildeado (sin node_modules ni .git) ───────────
      # El VPS reinstala node_modules (deploy-remote.sh) para que los symlinks
      # @cio/* del workspace resuelvan localmente. Transferimos código + dist/ +
      # build/ + manifests + infra.
      # Reintentado porque la red entre los runners y el VPS se corta a ratos:
      # tres deploys de una misma noche murieron acá con "connect to host port 22:
      # Connection timed out", y el servidor no registró NI UN intento de conexión
      # en esa ventana — los paquetes nunca llegaron. No hay nada que arreglar en
      # la máquina, así que lo que corresponde es no tirar abajo una compilación
      # entera por un corte de un minuto.
      #
      # rsync reanuda: lo ya copiado en un intento previo no se vuelve a mandar.
      #
      # Los .env van EXCLUIDOS, y eso no es una optimización: es lo que evita
      # dejar producción sin variables de entorno. Están gitignorados, así que
      # `--delete` los borraba en cada deploy y el paso 8 los reescribía un
      # segundo después. Mientras el rsync anduviera, nadie lo notaba. El día que
      # falló (2026-08-10), el borrado ya había ocurrido y el paso que los
      # recrea nunca corrió: el servidor quedó con los procesos vivos —
      # sostenidos por lo que dotenv ya tenía en memoria— y sin un solo .env en
      # disco. Cualquier reinicio lo habría tumbado, y los valores viven en un
      # secreto de GitHub que no se puede volver a leer desde el servidor.
      # Excluirlos hace que un rsync fallido no toque nada que no se pueda
      # reconstruir. (Vale lo mismo para infra/minio.env, que deploy-remote.sh
      # sabe recrear pero no tiene por qué tener que hacerlo.)
      #
      # Por el MISMO motivo se excluye `infra/clientes/*.conf`: los server blocks
      # de nginx de clientes con dominio propio están gitignorados —el repo es
      # público y un `server_name` real publica quién es cliente de quién—, así
      # que sólo existen en el VPS. Sin la exclusión, `--delete` los borraría en
      # cada deploy y nadie se enteraría hasta el próximo `nginx -s reload`.
      - name: Rsync to VPS
        run: |
          codigo=0
          for intento in 1 2 3; do
            rsync -az --delete \
              --timeout=60 \
              -e 'ssh -o ConnectTimeout=30 -o ServerAliveInterval=15' \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='**/node_modules' \
              --exclude='**/.svelte-kit' \
              --exclude='**/.turbo' \
              --exclude='**/*.tsbuildinfo' \
              --exclude='.env' \
              --exclude='**/.env' \
              --exclude='infra/minio.env' \
              --exclude='infra/clientes/*.conf' \
              ./ \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/classroomio/ && exit 0
            codigo=$?
            echo "::warning::rsync falló con código $codigo (intento $intento/3); reintentando en 30s"
            sleep 30
          done

          # El código de salida importa, y este mensaje solía ignorarlo: decía
          # "la red está caída" pasara lo que pasara. Un día el rsync moría por
          # permisos y ese texto mandó a diagnosticar conectividad durante media
          # hora, con el servidor respondiendo perfecto todo el tiempo.
          if [ "$codigo" = "23" ]; then
            echo "::error::rsync no pudo escribir algunos archivos (código 23). Casi siempre es PROPIEDAD, no red: algo dentro de /var/www/classroomio quedó creado por otro usuario (típicamente root, entrando a mano por SSH) y ${{ secrets.VPS_USER }} no lo puede sobrescribir. Para verlo: find /var/www/classroomio -not -user ${{ secrets.VPS_USER }} -not -path '*/node_modules/*' -not -path '*/.git/*'"
          else
            echo "::error::rsync falló tres veces con código $codigo. Ahí sí mirá la conectividad al puerto 22 antes que el código."
          fi
          exit 1

      # ── 8. Escribir los DOS .env en sus rutas ────────────────────────────
      # VPS_CIO_API_ENV es el archivo entero en un solo secreto, así que agregar
      # una variable obliga a reescribirlo completo. Las claves de un solo uso van
      # como secretos propios, apendeadas acá: se rotan sin volver a pegar el
      # resto, y si el secreto no existe la línea queda vacía (la API lo detecta y
      # lo dice en pantalla, ver isWebSearchConfigured).
      #
      # El criterio para decidir dónde va cada variable: en el secreto lo que no
      # puede verse (contraseñas, claves, DATABASE_URL); acá las perillas de
      # operación, que conviene que se vean. Qué modelo atiende el chat no es un
      # secreto, y dentro de seis meses "¿desde cuándo estamos en Gemini?" se
      # responde con git log en vez de abriendo un secreto que no se puede leer.
      #
      # CHAT_PROVIDER=google + GOOGLE_MODEL=gemini-3.5-flash-lite: se migró desde
      # MiniMax-M3. GOOGLE_API_KEY ya estaba (la usa el RAG) y sirve igual para
      # el chat — es la misma clave, no hay una por servicio. Gemini cachea el
      # prefijo de la petición SOLO, sin pedirle nada: medido con el prompt real
      # y las 26 herramientas, 88% de un prompt de 74k fichas vuelve como
      # cacheRead. Para volver a MiniMax, borrar estas dos líneas.
      # OJO: NO agregar providerOptions.google.cachedContent — es un 400 contra
      # cualquier petición que lleve herramientas. Ver knowledge/gemini-provider.md.
      #
      # CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_RENDERING_API_KEY: emiten los
      # certificados. El PDF se arma mandando el HTML del certificado a Cloudflare
      # Browser Rendering (Chrome headless por REST), porque la API es Node y no
      # tiene con qué maquetar CSS. Sin las dos, la descarga falla diciendo que
      # faltan. Van como secretos propios y NO dentro de VPS_CIO_API_ENV: si algún
      # día se los pone en el blob, hay que borrar estas dos líneas, porque lo
      # apendeado después pisa lo del blob y una línea vacía lo borraría.
      # El token es propio, con permiso "Browser Rendering - Edit"; no sirve el de DNS.
      #
      # AUDIT_*: las dos perillas de la auditoría. Van explícitas aunque coincidan
      # con el default del código, porque son decisiones de operación y no de
      # programación: SLOW_REQUEST_MS es a partir de cuántos ms un request se
      # anota como lento, y RETENTION_DAYS cuánto se guarda antes de que la purga
      # diaria lo borre — o sea, hasta cuándo se puede reconstruir qué pasó. Un
      # año es lo que hace falta para investigar un incidente viejo sin que la
      # tabla crezca sin techo. Para apagar la purga: AUDIT_PURGE_DISABLED=1.
      - name: Write API .env
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cat > /var/www/classroomio/apps/api/.env" <<'ENVEOF'
          ${{ secrets.VPS_CIO_API_ENV }}
          JINA_API_KEY=${{ secrets.JINA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_RENDERING_API_KEY=${{ secrets.CLOUDFLARE_RENDERING_API_KEY }}
          PUBLIC_IS_SELFHOSTED=false
          AUTH_COOKIE_DOMAIN=
          CHAT_PROVIDER=google
          GOOGLE_MODEL=gemini-3.5-flash-lite
          AUDIT_SLOW_REQUEST_MS=2000
          AUDIT_RETENTION_DAYS=365
          ENVEOF

      # Las líneas de abajo pisan al secreto (dotenv se queda con la última
      # aparición de cada clave), así se cambia el modo sin volver a pegar el
      # archivo entero.
      #
      # ORIGIN vacío es deliberado: adapter-node compara el header Origin contra
      # ese valor y responde 403 a los POST que no coincidan, así que un ORIGIN
      # fijo admite UN solo host — justo lo contrario de lo que necesita el
      # multiempresa. Vacío es falsy, y entonces adapter-node arma el origen con
      # PROTOCOL_HEADER + el header Host, que es lo que Nginx ya manda
      # (proxy_set_header Host $host / X-Forwarded-Proto $scheme).
      #
      # BODY_SIZE_LIMIT: adapter-node corta los cuerpos en 512 KB por defecto, y
      # el navegador habla con la API por /proxy del MISMO origen — o sea que TODA
      # subida pasa por acá. Con el valor por defecto, adjuntar un PDF de 2,4 MB a
      # las Fuentes del curso moría con un 500 genérico que ni siquiera llegaba a
      # la API (no aparecía en su log: lo rechazaba el dashboard), mientras el
      # diálogo prometía "hasta 25MB". 32 MB deja el tope real donde lo define la
      # aplicación (MAX_AGENT_DOCUMENT_SIZE = 25 MB), con aire para el sobre
      # multipart, y ahí sí responde el 413 explicativo de la API. Nginx ya venía
      # permitiendo 200–500 MB, así que este era el único cuello.
      - name: Write Dashboard .env
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cat > /var/www/classroomio/apps/dashboard/.env" <<'ENVEOF'
          ${{ secrets.VPS_CIO_DASHBOARD_ENV }}
          PUBLIC_IS_SELFHOSTED=false
          ORIGIN=
          PROTOCOL_HEADER=x-forwarded-proto
          BODY_SIZE_LIMIT=33554432
          ENVEOF

      # ── 9. Install + db:setup + MinIO + PM2 ──────────────────────────────
      - name: Run remote deploy
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /var/www/classroomio && bash infra/deploy-remote.sh"
